name: Build & Release ZentraDeck

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-audit:
    name: Pre-Release Security & Zero-Telemetry Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux headers for Go verification
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config

      - name: Verify Zero-Telemetry & No Dangerous Sinks
        run: |
          set -euo pipefail
          echo "Checking Go sources for forbidden outbound HTTP clients..."
          if grep -rnE '("net/http"|http\.Get|http\.Post|http\.Head|http\.NewRequest|http\.Client)' *.go; then
            echo "ERROR: Forbidden outbound HTTP client detected in Go source!"
            exit 1
          fi

          echo "Checking Frontend sources for forbidden network/eval/XSS sinks..."
          if grep -rnE '(fetch\(|axios|XMLHttpRequest|WebSocket|navigator\.sendBeacon|dangerouslySetInnerHTML|innerHTML|eval\(|new Function)' frontend/src; then
            echo "ERROR: Forbidden network call or dangerous DOM sink detected in frontend!"
            exit 1
          fi
          echo "[OK] Zero-telemetry and static safety checks passed."

      - name: Run go vet & govulncheck
        run: |
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Run npm production vulnerability audit & TypeScript build check
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

  build-windows:
    name: Windows (${{ matrix.arch }})
    needs: [security-audit]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI & NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          $goBin = Join-Path (go env GOPATH) "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          }

      - name: Build Portable (.zip) & Installer (.exe)
        shell: pwsh
        run: |
          wails build -clean -platform "windows/${{ matrix.arch }}" -nsis
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $exe = Get-ChildItem -Path build\bin\*.exe | Where-Object { $_.Name -notlike '*installer*' } | Select-Object -First 1
          if (-not $exe) { throw "Portable executable not found!" }
          Compress-Archive -Path $exe.FullName -DestinationPath "dist\ZentraDeck-windows-${{ matrix.arch }}-portable.zip" -Force

          $inst = Get-ChildItem -Path build\bin\*installer*.exe | Select-Object -First 1
          if ($inst) {
            Copy-Item -Path $inst.FullName -Destination "dist\ZentraDeck-windows-${{ matrix.arch }}-installer.exe" -Force
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  build-macos:
    name: macOS (Universal)
    needs: [security-audit]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Portable (.zip) & Installer (.dmg)
        run: |
          wails build -clean -platform darwin/universal
          mkdir -p dist dmg_stage

          APP_BUNDLE=$(find build/bin -maxdepth 1 -name "*.app" | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" dist/ZentraDeck-macos-universal-portable.zip

          cp -R "$APP_BUNDLE" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "ZentraDeck" -srcfolder dmg_stage -ov -format UDZO dist/ZentraDeck-macos-universal-installer.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*

  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: [security-audit]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            ai_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            ai_arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies, Wails CLI & nFPM
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config file desktop-file-utils
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Binary & Packages (.tar.gz, .deb, .rpm, .pkg.tar.zst, .AppImage)
        run: |
          set -euo pipefail
          wails build -clean -tags webkit2_41
          mkdir -p dist pkg_stage

          BIN_PATH=$(find build/bin -maxdepth 1 -type f -executable | head -n 1)
          BIN_NAME=$(basename "$BIN_PATH")
          chmod 755 "$BIN_PATH"

          # 1. Portable .tar.gz
          tar -czf "dist/ZentraDeck-linux-${{ matrix.arch }}-portable.tar.gz" -C build/bin "$BIN_NAME"

          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then VER="0.3.0"; fi

          cat <<'EOF' > pkg_stage/zentradeck.desktop
          [Desktop Entry]
          Name=ZentraDeck
          Comment=Lightweight, 100% local Linux Server Command Center over SSH
          Exec=zentradeck
          Icon=zentradeck
          Terminal=false
          Type=Application
          Categories=System;Network;Monitor;
          StartupWMClass=zentradeck
          EOF

          # 2. Native Distro Packages via nFPM (.deb, .rpm, .pkg.tar.zst)
          export PKG_ARCH="${{ matrix.arch }}"
          export PKG_VER="$VER"
          export BIN_PATH="$BIN_PATH"

          cat <<'EOF' > pkg_stage/nfpm.yaml
          name: "zentradeck"
          arch: "${PKG_ARCH}"
          platform: "linux"
          version: "${PKG_VER}"
          section: "utils"
          priority: "optional"
          maintainer: "Amir Hamrang <https://github.com/CyberRhythm>"
          description: "Lightweight, agentless, 100% local Linux server command center over SSH."
          homepage: "https://github.com/CyberRhythm/ZentraDeck"
          license: "MIT"
          contents:
            - src: "${BIN_PATH}"
              dst: "/usr/bin/zentradeck"
              file_info:
                mode: 0755
            - src: "pkg_stage/zentradeck.desktop"
              dst: "/usr/share/applications/zentradeck.desktop"
              file_info:
                mode: 0644
            - src: "build/appicon.png"
              dst: "/usr/share/icons/hicolor/512x512/apps/zentradeck.png"
              file_info:
                mode: 0644
          overrides:
            deb:
              depends:
                - libgtk-3-0 | libgtk-3-0t64
                - libwebkit2gtk-4.1-0
              recommends:
                - libayatana-appindicator3-1
            rpm:
              depends:
                - gtk3
                - webkit2gtk4.1
            archlinux:
              depends:
                - gtk3
                - webkit2gtk-4.1
          EOF

          nfpm package --config pkg_stage/nfpm.yaml --packager deb --target "dist/ZentraDeck-linux-${{ matrix.arch }}.deb"
          nfpm package --config pkg_stage/nfpm.yaml --packager rpm --target "dist/ZentraDeck-linux-${{ matrix.arch }}.rpm"
          nfpm package --config pkg_stage/nfpm.yaml --packager archlinux --target "dist/ZentraDeck-linux-${{ matrix.arch }}.pkg.tar.zst"

          # 3. Universal Linux AppImage
          APPDIR="pkg_stage/ZentraDeck.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp "$BIN_PATH" "$APPDIR/usr/bin/zentradeck"
          chmod 755 "$APPDIR/usr/bin/zentradeck"
          cp pkg_stage/zentradeck.desktop "$APPDIR/zentradeck.desktop"
          cp pkg_stage/zentradeck.desktop "$APPDIR/usr/share/applications/zentradeck.desktop"
          cp build/appicon.png "$APPDIR/zentradeck.png"
          cp build/appicon.png "$APPDIR/.DirIcon"
          cp build/appicon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/zentradeck.png"

          cat <<'EOF' > "$APPDIR/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/zentradeck" "$@"
          EOF
          chmod 755 "$APPDIR/AppRun"

          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.ai_arch }}.AppImage" -o pkg_stage/appimagetool
          chmod +x pkg_stage/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH="${{ matrix.ai_arch }}" ./pkg_stage/appimagetool "$APPDIR" "dist/ZentraDeck-linux-${{ matrix.arch }}.AppImage"

          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true